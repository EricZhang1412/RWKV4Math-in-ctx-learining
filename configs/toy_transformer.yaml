model_type: transformer
model:
    family: transformer
    hidden_size: 64
    num_hidden_layers: 3
    num_attention_heads: 8
    intermediate_size: 256
    hidden_act: "swish"
    initializer_range: 0.02
    layer_norm_eps: 1e-12
    max_position_embeddings: 512
    vocab_size: 5

training:
    task: linear_regression
    data: gaussian
    num_tasks: null
    num_training_examples: null
    task_kwargs: {}
    batch_size: 256
    save_every_steps: 100
    keep_every_steps: 100000
    train_steps: 10001
    learning_rate: 0.001
    lr_scheduler:
        type: "step"          # step/exponential/cosine
        gamma: 0.95           # 衰减系数（所有策略通用）
        step_size: 1000       # 仅用于step策略（每隔多少步衰减）
    curriculum:
        dims:
            start: 5
            end: 5
            inc: 1
            interval: 2000
        points:
            start: 11
            end: 11
            inc: 2
            interval: 2000

out_dir: ./output_transformer_noLoop/linear_regression

wandb:
    name: "linear_regression_toy_transformer"
    project: in-context-training
    notes:
    log_every_steps: 10

test_run: false