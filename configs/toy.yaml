model:
    # n_dims: 5
    # n_positions: 11
    hidden_size: 64
    num_hidden_layers: 3
    head_dim: 64
    decay_low_rank_dim: 64
    gate_low_rank_dim: 128
    a_low_rank_dim: 64 
    v_low_rank_dim: 16
    max_position_embeddings: None
    vocab_size: 5

training:
    task: linear_regression
    data: gaussian
    num_tasks: null
    num_training_examples: null
    task_kwargs: {}
