    curriculum:
        dims:
            start: 5
            end: 5
            inc: 1
            interval: 2000
        points:
            start: 11
            end: 11
            inc: 2
            interval: 2000

out_dir: ./output/linear_regression

wandb:
    name: "linear_regression_toy"
    project: in-context-training
    notes:
    log_every_steps: 10

test_run: false